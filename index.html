<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDP | MONITORAMENTO SUPREME</title>
    
    <!-- Firebase e Leaflet -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --cyan: #06b6d4;
            --gold: #fde047;
            --slate: #020617;
            --red: #ef4444;
            --green: #22c55e;
            --jdp-gold-gradient: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background: var(--slate); 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
        }

        /* --- TELA DE BLOQUEIO / ENTRADA DE ID SUPREME --- */
        #tela-seguranca {
            position: fixed;
            inset: 0;
            background: var(--slate);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            padding: 20px;
        }

        .painel-bloqueio {
            text-align: center;
            max-width: 380px;
            width: 100%;
            background: #0f172a;
            border: 2px solid var(--cyan);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
        }

        .img-bloqueio {
            max-width: 120px;
            border-radius: 12px;
            border: 2px solid var(--gold);
            margin: 0 auto 15px auto;
            display: block;
        }

        .terminal-status {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            margin-top: 15px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .input-id-mapa {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 10px;
            border: 2px solid var(--cyan);
            background: #000;
            color: var(--gold);
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            letter-spacing: 2px;
        }

        .btn-conectar-mapa {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: var(--jdp-gold-gradient);
            border: none;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            cursor: pointer;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.4);
        }

        /* --- ALERTA VISUAL DE BUZINA (HUD) --- */
        #alerta-buzina {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(2, 6, 23, 0.95);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            opacity: 0;
        }

        #alerta-buzina.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            animation: flashBuzina 0.5s infinite alternate;
        }

        @keyframes flashBuzina {
            from { border-color: var(--cyan); box-shadow: 0 0 15px rgba(6, 182, 212, 0.6); }
            to { border-color: var(--gold); box-shadow: 0 0 25px rgba(253, 224, 71, 0.8); }
        }

        /* --- BOTÃO CONTROLE DE BUZINA NO MAPA --- */
        #btn-buzina-mapa {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: var(--slate);
            border: 2px solid var(--cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan);
            font-size: 24px;
            cursor: pointer;
            z-index: 2000;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            transition: all 0.3s ease;
        }

        #btn-buzina-mapa:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: scale(1.1);
        }

        /* --- MAPA E COMPONENTES --- */
        #map { 
            width: 100%; 
            height: 100%; 
            transition: all 1s ease; 
            background: var(--slate);
        }

        .leaflet-tile {
            filter: invert(90%) hue-rotate(180deg) brightness(0.9) contrast(1.1);
        }
                  
        #tv-midia { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            width: 300px; 
            height: 200px; 
            background: #000; 
            border: 3px solid var(--gold); 
            border-radius: 10px; 
            z-index: 1000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        #tv-midia .midia-content { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
                  
        #btn-logo { 
            position: absolute; 
            bottom: 30px; 
            left: 30px; 
            width: 80px; 
            height: 80px; 
            z-index: 2000; 
            cursor: pointer; 
            border-radius: 50%; 
            border: 3px solid var(--gold); 
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.5); 
        }

        .modo-tv #map { height: 0%; opacity: 0; }
        .modo-tv #tv-midia { width: 100%; height: 100%; bottom: 0; right: 0; border: none; border-radius: 0; }
                  
        .hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
        .text-cyan { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        .text-gold { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .text-red-500 { color: var(--red); }
        .text-green-500 { color: #22c55e; }

        .leaflet-popup-content-wrapper {
            background: #020617 !important;
            border: 2px solid var(--cyan) !important;
            color: #fff !important;
            border-radius: 8px !important;
        }
        .leaflet-div-icon { background: transparent !important; border: none !important; }
    </style>
</head>
<body>

    <div id="alerta-buzina">
        <div style="font-size: 24px;">🔊</div>
        <div>
            <h4 class="text-gold" style="margin: 0; font-family: 'Orbitron'; font-size: 14px;">MOTOBOY CHEGANDO!</h4>
            <span class="text-cyan" style="font-size: 11px; font-weight: bold;">ELE BUZINOU NO PORTÃO</span>
        </div>
    </div>

    <div id="btn-buzina-mapa" title="Disparar Buzina Manual" onclick="dispararBuzinaManual()">
        <i class="fa-solid fa-volume-high"></i>
    </div>

    <!-- TELA DE SEGURANÇA E ENTRADA DE ID -->
    <div id="tela-seguranca">
        <div class="painel-bloqueio">
            <img id="status-img" src="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1779707901946_1776103715509.png" class="img-bloqueio" alt="Logo">
            <h2 class="text-cyan font-bold text-base tracking-wider uppercase mb-1" style="font-family: 'Orbitron';">RASTREIO SUPREME</h2>
            <p id="mensagem-seguranca" class="text-[11px] text-slate-400 uppercase tracking-widest">DIGITE O ID DO SEU PEDIDO</p>
            
            <input type="text" id="inputPedidoID" class="input-id-mapa" placeholder="EX: JDP-XXXX" maxlength="12">
            <button class="btn-conectar-mapa" onclick="conectarComIDManual()">ACESSAR MAPA</button>

            <div id="terminal-log" class="terminal-status">AGUARDANDO CREDENCIAL...</div>
        </div>
    </div>

    <div id="map"></div>
          
    <div id="tv-midia">
        <div id="display-area"></div>
    </div>
              
    <a href="https://pradodalapa-hue.github.io/JDPSISISTEMAROLETEPRIVATEWTUWIWIIS/" target="_blank">
        <img id="btn-logo" src="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1779773266613_1776103725063.png" alt="Cardápio">
    </a>

    <script>
        firebase.initializeApp({ databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com" });
        const db = firebase.database();
        const LOJA_ID = 'LEOVARDIOS_burguer_2026';
                  
        const urlParams = new URLSearchParams(window.location.search);
        let pedidoID = urlParams.get('pedido');

        const telaSeguranca = document.getElementById('tela-seguranca');
        const terminalLog = document.getElementById('terminal-log');
        const mensagemSeguranca = document.getElementById('mensagem-seguranca');
        const inputPedidoID = document.getElementById('inputPedidoID');
        const alertaBuzina = document.getElementById('alerta-buzina');

        let map, markerMotoboy, markerDestino;
        let adsCache = ["https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1776919033775_Engenheiro_Transparente__1_.png"];
        let adIndex = 0;
        let mapaInicializado = false;
        let firebaseListener = null;

        const AUDIO_BUZINA_URL = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/media/jdp_1781371308253_Buzina_marca_BZM_para_Motos_1_tom_MP3_160K_.mp3"; 
        let audioCtx = null;
        let audioBuzinaElement = new Audio(AUDIO_BUZINA_URL);
        audioBuzinaElement.preload = "auto";

        function inicializarAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        window.addEventListener('click', inicializarAudioContext, { once: false });

        function dispararBuzina() {
            audioBuzinaElement.play().catch(() => {});
            alertaBuzina.classList.add('active');
            setTimeout(() => { alertaBuzina.classList.remove('active'); }, 4000);
        }

        function dispararBuzinaManual() {
            dispararBuzina();
            db.ref(`lojas/${LOJA_ID}/motoboy_status`).update({ buzina_trigger: Date.now() });
        }

        // Se o usuário digitou o ID manualmente na tela inicial do mapa
        function conectarComIDManual() {
            const val = inputPedidoID.value.trim().toUpperCase();
            if (!val) return alert("DIGITE O ID DO PEDIDO!");
            pedidoID = val;
            // Atualiza a URL sem recarregar a página
            window.history.replaceState({}, '', `?pedido=${pedidoID}`);
            verificarSeguranca();
        }

        // Se já veio com o parâmetro ?pedido= na URL, preenche o input automaticamente
        if (pedidoID) {
            inputPedidoID.value = pedidoID;
            verificarSeguranca();
        }

        // --- VALIDAÇÃO DIRETA EM TEMPO REAL COM O MOTOBOY ---
        function verificarSeguranca() {
            if (!pedidoID || !pedidoID.startsWith('JDP-')) {
                terminalLog.innerText = "DIGITE UM ID VÁLIDO (JDP-)";
                return;
            }

            terminalLog.innerText = "VERIFICANDO ROTA COM O MOTOBOY...";

            if (firebaseListener) db.ref(`lojas/${LOJA_ID}`).off('value', firebaseListener);

            firebaseListener = db.ref(`lojas/${LOJA_ID}`).on('value', snap => {
                const loja = snap.val() || {};
                const rAtivo = loja.rastreio_ativo ? loja.rastreio_ativo[pedidoID] : null;
                const pConcluido = loja.pedidos_concluidos ? loja.pedidos_concluidos[pedidoID] : null;
                const pEmEntrega = loja.pedido_em_entrega || {};

                // Valida se o pedido está ativo na pista ou carregado na moto do motoboy
                const estaEmRota = (rAtivo && (rAtivo.na_pista === true || rAtivo.status === "em_rota" || rAtivo.status === "PRONTO_PARA_ENTREGA")) || (pEmEntrega.id === pedidoID);

                if (estaEmRota) {
                    liberarAcesso();
                } else if (pConcluido) {
                    terminalLog.innerText = "ENTREGA JÁ CONCLUÍDA!";
                    telaSeguranca.classList.remove('hidden');
                } else {
                    terminalLog.innerText = "AGUARDANDO O MOTOBOY LIBERAR A ROTA";
                    telaSeguranca.classList.remove('hidden');
                }
            });
        }

        function liberarAcesso() {
            terminalLog.innerText = "CONECTADO AO MOTOBOY!";
            telaSeguranca.classList.add('hidden');
            inicializarMapa();
        }

        function inicializarMapa() {
            if (mapaInicializado) return;
            mapaInicializado = true;

            map = L.map('map', { zoomControl: true, attributionControl: false }).setView([-2.9903, -60.0673], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Telemetria do Motoboy
            db.ref(`lojas/${LOJA_ID}/motoboy_status`).on('value', snap => {
                const pos = snap.val();
                document.body.classList.toggle('modo-tv', !(pos && pos.online));
                                          
                if (pos && pos.online) {
                    const bearing = pos.bearing || 0;
                    const imgDireita = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1781366116603_1001229381.png";
                    const imgEsquerda = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1781368263004_Engenheiro_Transparente.png";
                    
                    let imgAtiva = bearing > 180 && bearing <= 360 ? imgEsquerda : imgDireita;
                    const iconHtml = `<img src="${imgAtiva}" style="width: 38px; height: 38px; filter: drop-shadow(0 0 5px rgba(6,182,212,0.95)); display: block; background: transparent;">`;
                    
                    if (!markerMotoboy) {
                        markerMotoboy = L.marker([pos.latitude, pos.longitude], {
                            icon: L.divIcon({ html: iconHtml, iconSize: [38, 38], iconAnchor: [19, 19] })
                        }).addTo(map);
                    } else {
                        markerMotoboy.setLatLng([pos.latitude, pos.longitude]);
                        markerMotoboy.setIcon(L.divIcon({ html: iconHtml, iconSize: [38, 38], iconAnchor: [19, 19] }));
                    }
                    map.panTo([pos.latitude, pos.longitude]);
                }
            });

            // Gatilho de Buzina do Motoboy
            let ultimoBuzinar = null;
            db.ref(`lojas/${LOJA_ID}/motoboy_status/buzina_trigger`).on('value', snap => {
                const val = snap.val();
                if (val && val !== ultimoBuzinar) {
                    ultimoBuzinar = val;
                    dispararBuzina();
                }
            });

            // Marcador de Destino do Cliente
            db.ref(`lojas/${LOJA_ID}/rastreio_ativo/${pedidoID}`).on('value', snap => {
                const data = snap.val();
                if (data && data.latDestino && data.lngDestino) {
                    const lat = parseFloat(data.latDestino);
                    const lng = parseFloat(data.lngDestino);
                    const nomeCliente = data.cliente_nome || data.mesa || "CLIENTE";
                    const enderecoCliente = data.endereco || "MANAUS";

                    const placaConteudo = `
                        <div style="background:#020617; padding:10px; border-radius:6px; color:#fff;">
                            <b style="color:var(--gold);">ID: ${pedidoID}</b><br>
                            <span style="color:var(--cyan);">${nomeCliente.toUpperCase()}</span><br>
                            <small>${enderecoCliente.toUpperCase()}</small>
                        </div>
                    `;

                    if (!markerDestino) {
                        markerDestino = L.marker([lat, lng], {
                            icon: L.divIcon({ html: '<div style="font-size:28px;">📍</div>', iconSize: [28, 28], iconAnchor: [14, 28] })
                        }).addTo(map).bindPopup(placaConteudo).openPopup();
                    } else {
                        markerDestino.setLatLng([lat, lng]);
                        markerDestino.setPopupContent(placaConteudo);
                    }
                }
            });
        }

        function motorPublicidade() {
            db.ref(`publicidade/prado_67`).on('value', snap => {
                if(snap.exists()) adsCache = Object.values(snap.val());
            });

            setInterval(() => {
                const displayArea = document.getElementById('display-area');
                if (adsCache.length > 0) {
                    adIndex = (adIndex + 1) % adsCache.length;
                    const url = adsCache[adIndex];
                    displayArea.style.opacity = 0;
                    setTimeout(() => {
                        displayArea.innerHTML = url.match(/\.(mp4|webm|ogg)$/i) ? 
                            `<video class="midia-content" autoplay muted loop src="${url}"></video>` : 
                            `<img class="midia-content" src="${url}">`;
                        displayArea.style.opacity = 1;
                    }, 500);
                }
            }, 10000);
        }

        motorPublicidade();
    </script>
</body>
</html>
