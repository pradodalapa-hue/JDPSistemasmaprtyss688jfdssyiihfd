<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JDP | Rastreio e Monitoramento Supremo</title>
                         
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <!-- Leaflet Engine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
         
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --cyan: #06b6d4;
            --gold: #fde047;
            --red: #ef4444;
            --green: #22c55e;
            --jdp-gold-gradient: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* --- TELA DE PORTAL / STATUS E CONSULTA DE ID --- */
        #portal-container {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            transition: all 0.5s ease;
        }

        /* Esconde e desativa completamente o portal quando no mapa */
        #portal-container.desativado {
            display: none !important;
            pointer-events: none !important;
        }

        .portal-box {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }

        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--cyan); padding-bottom: 15px; }
        .header h1 { 
             font-family: 'Orbitron', sans-serif;
             color: var(--cyan); 
             font-size: 16px; 
             text-transform: uppercase; 
             letter-spacing: 2px; 
             margin: 0; 
             text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }

        .input-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .input-id {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: 2px solid #1e293b;
            background: #000;
            color: var(--gold);
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            text-align: center;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .input-id:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .btn-rastrear {
            width: 100%;
            padding: 16px;
            background: var(--jdp-gold-gradient);
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            cursor: pointer;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* PAINEL DE STATUS EM TEMPO REAL */
        .status-container {
            margin-top: 20px;
            background: var(--card);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }

        .status-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            color: #64748b;
        }

        .status-badge-exibicao {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .status-mensagem {
            font-size: 13px;
            line-height: 1.5;
            color: #cbd5e1;
            text-align: center;
            padding: 15px;
            background: #020617;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .btn-mapa-direto {
            width: 100%;
            padding: 14px;
            background: var(--green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(34, 197, 150, 0.3);
        }

        /* --- ÁREA DO MAPA E HUD --- */
        #map { 
            width: 100vw; 
            height: 100vh; 
            position: absolute;
            inset: 0;
            background: #020617;
            z-index: 1;
        }

        .leaflet-tile {
            filter: invert(90%) hue-rotate(180deg) brightness(0.9) contrast(1.1);
        }

        /* ALERTA DE BUZINA */
        #alerta-buzina {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(2, 6, 23, 0.95);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.5s ease;
            pointer-events: none;
            opacity: 0;
        }
        #alerta-buzina.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* TV DE MÍDIA / PUBLICIDADE */
        #tv-midia { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            width: 300px; 
            height: 200px; 
            background: #000; 
            border: 3px solid var(--gold); 
            border-radius: 10px; 
            z-index: 1000;
            display: none; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        #tv-midia .midia-content { width: 100%; height: 100%; object-fit: cover; }
        
        .modo-tv #map { display: none !important; }
        .modo-tv #tv-midia { display: flex; width: 100%; height: 100%; bottom: 0; right: 0; border: none; border-radius: 0; z-index: 5000; }

        .leaflet-popup-content-wrapper { background: #020617 !important; border: 2px solid var(--cyan) !important; color: #fff !important; border-radius: 8px !important; }
        .leaflet-div-icon { background: transparent !important; border: none !important; }
    </style>
</head>
<body>

    <!-- HUD DE BUZINA -->
    <div id="alerta-buzina">
        <div style="font-size: 24px;">🔊</div>
        <div>
            <h4 style="color: var(--gold); margin: 0; font-family: 'Orbitron'; font-size: 14px;">MOTOBOY CHEGANDO!</h4>
            <span style="color: var(--cyan); font-size: 11px; font-weight: bold;">ELE BUZINOU NO PORTÃO</span>
        </div>
    </div>

    <!-- TELA DE PORTAL / STATUS E CONSULTA -->
    <div id="portal-container">
        <div class="portal-box">
            <div class="header">
                <h1>DONY BURGUER'S - RASTREIO 🛵</h1>
            </div>
                               
            <div class="input-container">
                <input type="text" id="input-id" class="input-id" placeholder="ID DO PEDIDO (JDP-)" maxlength="12">
            </div>
                               
            <button id="btn-master" class="btn-rastrear" onclick="rastrearPedidoManual()">
                <i class="fas fa-search"></i> CONSULTAR STATUS
            </button>

            <!-- PAINEL DE STATUS EM TEMPO REAL -->
            <div class="status-container" id="painelStatus">
                <div class="status-header">
                    <span class="status-title" id="idDisplay">ID: #00000</span>
                    <span class="status-badge-exibicao" id="badgeDisplay">STATUS</span>
                </div>
                <div class="status-mensagem" id="msgDisplay">
                    Processando dados de telemetria...
                </div>
                <button class="btn-mapa-direto" id="btnMapa" onclick="entrarNoMapa()">
                    <i class="fas fa-map-marked-alt"></i> ABRIR MAPA EM TEMPO REAL
                </button>
            </div>
        </div>
    </div>

    <!-- ÁREA DO MAPA -->
    <div id="map"></div>

    <!-- TV DE PUBLICIDADE -->
    <div id="tv-midia">
        <div id="display-area"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const LOJA_ID = "LEOVARDIOS_burguer_2026";

        const urlParams = new URLSearchParams(window.location.search);
        let idPedidoBuscado = urlParams.get('pedido') || "";

        let refPendente = null, refRastreio = null, refConcluido = null;
        let dadosPendente = null, dadosRastreio = null, dadosConcluido = null;

        let map = null, markerMotoboy = null, markerDestino = null;
        let mapaInicializado = false;
        let adsCache = [];
        let adIndex = 0;

        const AUDIO_BUZINA_URL = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/media/jdp_1781371308253_Buzina_marca_BZM_para_Motos_1_tom_MP3_160K_.mp3"; 
        const audioBuzinaElement = new Audio(AUDIO_BUZINA_URL);

        function inicializarMapaEngine() {
            if (mapaInicializado) return;
            mapaInicializado = true;

            map = L.map('map', { zoomControl: true, attributionControl: false }).setView([-2.9903, -60.0673], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Telemetria do Motoboy
            db.ref(`lojas/${LOJA_ID}/motoboy_status`).on('value', snap => {
                const pos = snap.val();
                if (pos && pos.online) {
                    const bearing = pos.bearing || 0;
                    const imgDireita = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1781366116603_1001229381.png";
                    const imgEsquerda = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1781368263004_Engenheiro_Transparente.png";
                    let imgAtiva = bearing > 180 && bearing <= 360 ? imgEsquerda : imgDireita;
                    const iconHtml = `<img src="${imgAtiva}" style="width: 38px; height: 38px; filter: drop-shadow(0 0 5px rgba(6,182,212,0.95)); display: block; background: transparent;">`;
                    
                    if (!markerMotoboy) {
                        markerMotoboy = L.marker([pos.latitude, pos.longitude], {
                            icon: L.divIcon({ html: iconHtml, iconSize: [38, 38], iconAnchor: [19, 19] })
                        }).addTo(map);
                    } else {
                        markerMotoboy.setLatLng([pos.latitude, pos.longitude]);
                        markerMotoboy.setIcon(L.divIcon({ html: iconHtml, iconSize: [38, 38], iconAnchor: [19, 19] }));
                    }
                    map.panTo([pos.latitude, pos.longitude]);
                }
            });

            // Buzina
            let ultimoBuzinar = null;
            db.ref(`lojas/${LOJA_ID}/motoboy_status/buzina_trigger`).on('value', snap => {
                const val = snap.val();
                if (val && val !== ultimoBuzinar) {
                    ultimoBuzinar = val;
                    audioBuzinaElement.play().catch(() => {});
                    const alerta = document.getElementById('alerta-buzina');
                    alerta.classList.add('active');
                    setTimeout(() => alerta.classList.remove('active'), 4000);
                }
            });

            // Destino
            if (idPedidoBuscado) {
                db.ref(`lojas/${LOJA_ID}/rastreio_ativo/${idPedidoBuscado}`).on('value', snap => {
                    const data = snap.val();
                    if (data && data.latDestino && data.lngDestino) {
                        const lat = parseFloat(data.latDestino);
                        const lng = parseFloat(data.lngDestino);
                        const nomeCliente = data.cliente_nome || "CLIENTE";
                        const enderecoCliente = data.endereco || "MANAUS";

                        const placaConteudo = `<div style="background:#020617; padding:10px; border-radius:6px; color:#fff;"><b style="color:var(--gold);">ID: ${idPedidoBuscado}</b><br><span style="color:var(--cyan);">${nomeCliente.toUpperCase()}</span><br><small>${enderecoCliente.toUpperCase()}</small></div>`;

                        if (!markerDestino) {
                            markerDestino = L.marker([lat, lng], {
                                icon: L.divIcon({ html: '<div style="font-size:28px;">📍</div>', iconSize: [28, 28], iconAnchor: [14, 28] })
                            }).addTo(map).bindPopup(placaConteudo).openPopup();
                        } else {
                            markerDestino.setLatLng([lat, lng]);
                            markerDestino.setPopupContent(placaConteudo);
                        }
                    }
                });
            }
        }

        if (idPedidoBuscado) {
            document.getElementById('input-id').value = idPedidoBuscado;
            iniciarEscutaFirebase(idPedidoBuscado);
        }

        function rastrearPedidoManual() {
            const input = document.getElementById('input-id');
            const id = input.value.trim().toUpperCase();
            if (!id) return alert("Digite o ID do seu pedido.");

            idPedidoBuscado = id;
            window.history.replaceState({}, '', `?pedido=${id}`);
            iniciarEscutaFirebase(id);
        }

        function iniciarEscutaFirebase(id) {
            destruirListenersAnteriores();

            refPendente = db.ref(`lojas/${LOJA_ID}/producao_pendente/${id}`);
            refRastreio = db.ref(`lojas/${LOJA_ID}/rastreio_ativo/${id}`);
            refConcluido = db.ref(`lojas/${LOJA_ID}/pedidos_concluidos/${id}`);

            refPendente.on('value', snap => { dadosPendente = snap.val(); processarFusaoDeEstados(); });
            refRastreio.on('value', snap => { dadosRastreio = snap.val(); processarFusaoDeEstados(); });
            refConcluido.on('value', snap => { dadosConcluido = snap.val(); processarFusaoDeEstados(); });
        }

        function destruirListenersAnteriores() {
            if (refPendente) refPendente.off();
            if (refRastreio) refRastreio.off();
            if (refConcluido) refConcluido.off();
            dadosPendente = null; dadosRastreio = null; dadosConcluido = null;
        }

        // --- MÁQUINA DE ESTADOS SOBERANA ---
        function processarFusaoDeEstados() {
            const painel = document.getElementById('painelStatus');
            painel.style.display = "flex";
            document.getElementById('idDisplay').innerText = `ID: #${idPedidoBuscado}`;

            if (dadosRastreio && (dadosRastreio.na_pista === true || dadosRastreio.status === "em_rota")) {
                exibirEstadoEmRota();
                return;
            }
            if ((dadosPendente && dadosPendente.status === "PRONTO") || (dadosRastreio && (dadosRastreio.status === "PRONTO_PARA_ENTREGA" || dadosRastreio.status === "PRONTO"))) {
                exibirEstadoPronto();
                return;
            }
            if (dadosPendente && (dadosPendente.status === "ESPERA" || dadosPendente.status === "PREPARANDO" || dadosPendente.status === "Pendente")) {
                exibirEstadoPedidoAceito();
                return;
            }
            if (dadosConcluido || (dadosRastreio && (dadosRastreio.status === "entregue" || dadosRastreio.status === "CONCLUIDO" || dadosRastreio.expirado === true))) {
                exibirEstadoConcluido();
                return;
            }
            if (dadosRastreio && dadosRastreio.giro_autorizado !== true) {
                exibirEstadoAguardandoPagamento();
                return;
            }

            exibirEstadoInexistente();
        }

        function exibirEstadoPedidoAceito() {
            document.getElementById('badgeDisplay').innerText = "ACEITO NA COZINHA";
            document.getElementById('badgeDisplay').style.background = "var(--gold)";
            document.getElementById('badgeDisplay').style.color = "#000";
            document.getElementById('msgDisplay').innerHTML = `<i class="fas fa-receipt" style="color:var(--gold); font-size: 22px; margin-bottom: 10px; display:block;"></i>PEDIDO ACEITO NA COZINHA!<br>Seu pedido está na esteira de preparação.`;
            document.getElementById('btnMapa').style.display = "none";
        }

        function exibirEstadoPronto() {
            document.getElementById('badgeDisplay').innerText = "PRONTO";
            document.getElementById('badgeDisplay').style.background = "var(--cyan)";
            document.getElementById('badgeDisplay').style.color = "#000";
            document.getElementById('msgDisplay').innerHTML = `<i class="fas fa-hamburger" style="color:var(--cyan); font-size: 22px; margin-bottom: 10px; display:block;"></i>SEU PEDIDO ESTÁ PRONTO!<br>Aguardando o motoboy iniciar a rota.`;
            document.getElementById('btnMapa').style.display = "none";
        }

        function exibirEstadoEmRota() {
            document.getElementById('badgeDisplay').innerText = "A CAMINHO";
            document.getElementById('badgeDisplay').style.background = "var(--green)";
            document.getElementById('badgeDisplay').style.color = "#000";
            document.getElementById('msgDisplay').innerHTML = `<i class="fas fa-motorcycle" style="color:var(--green); font-size: 22px; margin-bottom: 10px; display:block;"></i>A CAMINHO!<br>Seu pedido foi despachado. Clique abaixo para abrir o mapa em tempo real!`;
            
            const btnMapa = document.getElementById('btnMapa');
            btnMapa.style.display = "flex";
            
            entrarNoMapa();
        }

        function exibirEstadoConcluido() {
            document.getElementById('badgeDisplay').innerText = "ENTREGUE";
            document.getElementById('badgeDisplay').style.background = "#1e293b";
            document.getElementById('badgeDisplay').style.color = "#94a3b8";
            document.getElementById('msgDisplay').innerHTML = `<i class="fas fa-check-circle" style="color:var(--green); font-size: 22px; margin-bottom: 10px; display:block;"></i>ENTREGA CONCLUÍDA!<br>Obrigado pela preferência.`;
            document.getElementById('btnMapa').style.display = "none";
        }

        function exibirEstadoAguardandoPagamento() {
            document.getElementById('badgeDisplay').innerText = "AGUARDANDO PAGAMENTO";
            document.getElementById('badgeDisplay').style.background = "var(--red)";
            document.getElementById('badgeDisplay').style.color = "#fff";
            document.getElementById('msgDisplay').innerHTML = `<i class="fas fa-wallet" style="color:var(--red); font-size: 22px; margin-bottom: 10px; display:block;"></i>AGUARDANDO PAGAMENTO...`;
            document.getElementById('btnMapa').style.display = "none";
        }

        function exibirEstadoInexistente() {
            document.getElementById('badgeDisplay').innerText = "NÃO ENCONTRADO";
            document.getElementById('badgeDisplay').style.background = "var(--red)";
            document.getElementById('badgeDisplay').style.color = "#fff";
            document.getElementById('msgDisplay').innerHTML = `<i class="fas fa-exclamation-triangle" style="color:var(--red); font-size: 22px; margin-bottom: 10px; display:block;"></i>ID INVÁLIDO OU EXPIRADO.`;
            document.getElementById('btnMapa').style.display = "none";
        }

        // --- ENTRAR NO MAPA COM ATUALIZAÇÃO REATIVA ---
        function entrarNoMapa() {
            // Remove a tela do portal de consulta
            document.getElementById('portal-container').classList.add('desativado');
            document.body.classList.remove('modo-tv');

            // Inicializa a engine do mapa
            inicializarMapaEngine();

            // Atualiza tamanho do renderizador no próximo frame
            setTimeout(() => {
                if (map) {
                    map.invalidateSize();
                }
            }, 100);
        }

        function motorPublicidade() {
            db.ref(`publicidade/prado_67`).on('value', snap => {
                if(snap.exists()) adsCache = Object.values(snap.val());
            });

            setInterval(() => {
                const displayArea = document.getElementById('display-area');
                const ocioso = !document.getElementById('portal-container').classList.contains('desativado');
                
                document.body.classList.toggle('modo-tv', ocioso && adsCache.length > 0);

                if (adsCache.length > 0 && ocioso) {
                    adIndex = (adIndex + 1) % adsCache.length;
                    const url = adsCache[adIndex];
                    displayArea.style.opacity = 0;
                    setTimeout(() => {
                        displayArea.innerHTML = url.match(/\.(mp4|webm|ogg)$/i) ? 
                            `<video class="midia-content" autoplay muted loop src="${url}"></video>` : 
                            `<img class="midia-content" src="${url}">`;
                        displayArea.style.opacity = 1;
                    }, 500);
                }
            }, 10000);
        }

        motorPublicidade();

        document.getElementById('input-id').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') rastrearPedidoManual();
        });
    </script>
</body>
</html>
